name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  preflight:
    name: Verify release ref
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Verify release source
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if [[ ! "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-(beta|rc|alpha)(\.?[0-9]*)?)?$ ]]; then
            echo "Unsupported release tag format: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          COMMIT_SHA="$(git rev-parse 'HEAD^{commit}')"
          RELATION="$(gh api "repos/$GITHUB_REPOSITORY/compare/$COMMIT_SHA...main" --jq '.status + ":" + .merge_base_commit.sha')"
          if [[ "$RELATION" != "identical:$COMMIT_SHA" && "$RELATION" != "ahead:$COMMIT_SHA" ]]; then
            echo "Release tag does not point to a commit on main" >&2
            exit 1
          fi

          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"
          CARGO_VERSION="$(awk -F '"' '/^version =/ {print $2; exit}' Cargo.toml)"
          if [[ "$CARGO_VERSION" != "$VERSION" && "$CARGO_VERSION" != "$BASE_VERSION" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match Cargo.toml version $CARGO_VERSION" >&2
            exit 1
          fi

          if ! grep -Eq "^## \\[$VERSION\\]" CHANGELOG.md && ! grep -Eq "^## \\[$BASE_VERSION\\]" CHANGELOG.md; then
            echo "CHANGELOG.md has no release entry for $VERSION or $BASE_VERSION" >&2
            exit 1
          fi

  build:
    name: Build ${{ matrix.target }}
    needs: preflight
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-14

          # Intel Mac
          - target: x86_64-apple-darwin
            os: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="pass-tomb-v${VERSION}-${{ matrix.target }}.tar.gz"

          mkdir package
          for binary in pass-tomb pass-open pass-close pass-timer; do
            cp "target/${{ matrix.target }}/release/${binary}" package/
          done

          tar -czf "$ARCHIVE" -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pass-tomb-${{ matrix.target }}
          path: "*.tar.gz"

  release:
    name: Create Release
    needs: [preflight, build]
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: pass-tomb-*
          merge-multiple: true

      - name: Extract changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          BASE_VERSION="${VERSION%%-*}"

          TARGET_VERSION="$VERSION"
          if ! grep -Eq "^## \\[$TARGET_VERSION\\]" CHANGELOG.md; then
            TARGET_VERSION="$BASE_VERSION"
          fi

          awk -v version="$TARGET_VERSION" '
            $0 ~ "^## \\[" version "\\]" {
              found=1
              next
            }

            found && $0 ~ "^## \\[" {
              exit
            }

            found {
              print
            }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog entry found for v${TARGET_VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v}"

          CREATE_ARGS=(
            "${GITHUB_REF_NAME}"
            artifacts/*.tar.gz
            --title "${GITHUB_REF_NAME}"
            --notes-file RELEASE_NOTES.md
          )

          if [[ "$VERSION" =~ -(beta|rc|alpha) ]]; then
            CREATE_ARGS+=(--prerelease)
          fi

          gh release create "${CREATE_ARGS[@]}"
