name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        include:
          # Apple Silicon
          - target: aarch64-apple-darwin
            os: macos-14

          # Intel Mac
          - target: x86_64-apple-darwin
            os: macos-15-intel

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Build macOS
        env:
          MACOSX_DEPLOYMENT_TARGET: "11.0"
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARCHIVE="pass-tomb-v${VERSION}-${{ matrix.target }}.tar.gz"

          mkdir package
          for binary in pass-tomb pass-open pass-close pass-timer; do
            cp "target/${{ matrix.target }}/release/${binary}" package/
          done

          tar -czf "$ARCHIVE" -C package .

      - name: Upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: pass-tomb-${{ matrix.target }}
          path: "*.tar.gz"

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Download artifacts
        uses: actions/download-artifact@v5
        with:
          path: artifacts
          pattern: pass-tomb-*
          merge-multiple: true

      - name: Extract changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"

          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" {
              found=1
              next
            }

            found && $0 ~ "^## \\[" {
              exit
            }

            found {
              print
            }
          ' CHANGELOG.md > RELEASE_NOTES.md

          if [ ! -s RELEASE_NOTES.md ]; then
            echo "No changelog entry found for v${VERSION}"
            exit 1
          fi

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            artifacts/*.tar.gz \
            --title "${GITHUB_REF_NAME}" \
            --notes-file RELEASE_NOTES.md
